name: Refresh candidates

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  test-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Refresh candidates and mirrored dependencies
        if: github.event_name != 'pull_request'
        run: python scripts/refresh.py candidates

      - name: Verify stable files without claiming mainland origin
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/refresh.py verify
          --regions us cn
          --probe-origin github-actions-us-approximation

      - name: Commit candidate-only updates
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates vendor health
          if git diff --cached --quiet; then
            echo "No candidate changes"
          else
            git commit -m "Refresh HomeTV candidates"
            git push
          fi
