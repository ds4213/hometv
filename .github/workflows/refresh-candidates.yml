name: Refresh candidates

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  test-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v

      # PRs get this static check only; they never refresh or push repository data.
      - name: Verify checked-in regional artifacts
        run: python scripts/refresh.py verify --regions us cn

      - name: Refresh candidates and mirrored dependencies
        if: github.event_name != 'pull_request'
        run: python scripts/refresh.py candidates

      - name: Verify refreshed candidate context without claiming mainland origin
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/refresh.py verify
          --regions us cn
          --probe-origin github-actions-us-approximation

      - name: Commit candidate-only updates
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The allowlist intentionally omits all release artifacts.
          git add candidates vendor/manifest.json vendor/nitan vendor/wanger health
          git restore --staged stable 2>/dev/null || true
          git restore --staged vendor/live/auto-*.m3u 2>/dev/null || true

          forbidden="$(git diff --cached --name-only | grep -E '^(stable/|vendor/live/auto-.*\.m3u$)' || true)"
          if [ -n "$forbidden" ]; then
            echo "Refusing to stage release artifacts:"
            echo "$forbidden"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No candidate changes"
          else
            git commit -m "Refresh HomeTV candidates"
            git push
          fi
